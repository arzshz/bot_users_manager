[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "users-manager"
version = "0.1.0"
description = "Shared chat-id recorder hook for all bots running on the server"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["users_manager*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
